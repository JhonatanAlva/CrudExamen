<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a la Plataforma</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Encabezado / Título -->
            <div class="auth-header text-center">
                <h2 class="auth-title">Acceso a la Plataforma</h2>
            </div>

            <!-- Switch de Pestañas (Toggle) -->
            <div class="auth-toggle-container mb-4">
                <button type="button" class="toggle-btn active" id="btnShowLogin" onclick="switchTab('login')">
                    Iniciar Sesión
                </button>
                <button type="button" class="toggle-btn" id="btnShowRegister" onclick="switchTab('register')">
                    Registrarse
                </button>
            </div>

            <!-- Contenedor para Alertas y Mensajes -->
            <div id="alertContainer"></div>

            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <form id="loginForm" class="auth-form active" novalidate>
                <div class="mb-3">
                    <label for="loginUsuario" class="form-label">Carné o Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="loginUsuario"
                            placeholder="Ej: 1890-20-11489 o usuario@dominio.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="loginPassword" class="form-label">Contraseña (PIN)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Solo números"
                            pattern="^[0-9]+$" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-auth btn-primary-auth w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>

                <!-- BOTÓN PARA ENTRAR COMO VISITANTE -->
                <a href="catalogo.html" class="btn btn-outline-secondary w-100 border-0 btn-sm">
                    <i class="bi bi-eye me-1"></i> Continuar como Visitante
                </a>
            </form>

            <!-- FORMULARIO DE REGISTRO -->
            <form id="registerForm" class="auth-form" novalidate>
                <div class="mb-3">
                    <label for="regCarne" class="form-label">Carné</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                        <input type="text" class="form-control" id="regCarne" placeholder="9999-99-99999" maxlength="13"
                            pattern="^\d{4}-\d{2}-\d{5}$" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regEstudiante" class="form-label">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                        <input type="text" class="form-control" id="regEstudiante" placeholder="JUAN PEREZ" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regCorreo" class="form-label">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="regCorreo" placeholder="usuario@dominio.com"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="regPassword" class="form-label">Contraseña (PIN)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="regPassword" placeholder="Solo números"
                            pattern="^[0-9]+$" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-auth btn-success-auth w-100">
                    <i class="bi bi-person-plus me-2"></i>Registrarse
                </button>
            </form>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
